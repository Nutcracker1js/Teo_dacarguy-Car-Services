databases:
  - name: teo-car-services-db
    databaseName: teo_services
    user: teo_services_app
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: teo-car-services
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build:site
    preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: private-customer-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teo-car-services-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SERVE_WEBSITE
        value: "true"
      - key: CORS_ORIGINS
        value: https://nutcracker1js.github.io
      - key: PUBLIC_SITE_URL
        value: https://teo-dacarguy-car-services.onrender.com
      - key: BOOKING_REVIEW_TTL_HOURS
        value: "48"
      - key: PAYMENT_EXPIRY_HOURS
        value: "24"
      - key: ADMIN_USERNAME
        value: teo_admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
